[package]
name = "mouse-click-tool"
version = "3.1.0"
edition = "2021"
description = "简单好用的鼠标连点器 (egui 版 / egui-based auto clicker)"
authors = ["lalaki.cn"]
license = "MIT"
default-run = "mouse-click-tool"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
enigo = "0.6"
global-hotkey = "0.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
